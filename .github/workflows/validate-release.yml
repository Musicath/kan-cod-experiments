name: Validate released results

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reconstruct-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-analysis.txt
      - name: Install analysis dependencies
        run: python -m pip install -r requirements-analysis.txt
      - name: Reconstruct paper figures from released tables
        run: python experiments/analysis/run_all.py
      - name: Validate released data and figures
        run: python experiments/analysis/validate_release.py
